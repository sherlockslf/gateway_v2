quarkus.application.name=usig-bootstrap
quarkus.http.test-port=0
quarkus.index-dependency.usig-api.group-id=com.usig
quarkus.index-dependency.usig-api.artifact-id=usig-api
quarkus.index-dependency.usig-infra-redis.group-id=com.usig
quarkus.index-dependency.usig-infra-redis.artifact-id=usig-infra-redis
quarkus.index-dependency.usig-infra-objectstorage.group-id=com.usig
quarkus.index-dependency.usig-infra-objectstorage.artifact-id=usig-infra-objectstorage
quarkus.index-dependency.usig-infra-postgres.group-id=com.usig
quarkus.index-dependency.usig-infra-postgres.artifact-id=usig-infra-postgres
quarkus.websockets-next.server.supported-subprotocols=usig.events.v1
quarkus.websockets-next.server.max-frame-size=65536
quarkus.websockets-next.server.max-message-size=65536
quarkus.websockets-next.server.auto-ping-interval=30S
usig.websocket.allowed-origins=http://localhost,http://127.0.0.1
usig.websocket.allow-missing-origin=false
usig.websocket.require-secure=true
usig.websocket.max-message-bytes=65536
usig.websocket.session-ttl=PT15M
usig.concurrency.backend=memory
usig.circuit-breaker.backend=memory
usig.retry.create.safe-max-attempts=2
usig.retry.create.base-delay=PT0.01S
usig.retry.create.jitter-range=PT0.04S
usig.retry.resume.max-attempts=2
usig.retry.resume.base-delay=PT0.01S
usig.retry.resume.jitter-range=PT0.04S
usig.side-events.fail-fast-audit-tenants=
usig.side-events.outbox.max-entries=512
usig.side-events.outbox.drain.max-batch-size=32
usig.side-events.outbox.drain.retry-delay=PT30S
usig.side-events.outbox.drain.worker.enabled=false
usig.side-events.outbox.drain.worker.interval=PT30S
usig.image-upload.backend=memory
usig.image-upload.retention-duration=PT24H
usig.redis.key-prefix=usig
usig.service-registry.backend=memory
usig.service-registry.reload.enabled=false
usig.service-registry.reload.admin-token=
usig.service-registry.reload.source=none
usig.service-registry.reload.worker.enabled=false
usig.service-registry.reload.worker.interval=PT30S
usig.services.ids=sample-agent
usig.services.sample-agent.service-type=AGENT
usig.services.sample-agent.endpoint=https://internal.example/sample-agent
usig.services.sample-agent.adapter-id=sample-agent-v1
usig.services.sample-agent.visible-tenants=tenant_1
usig.services.sample-agent.transports=SSE,WEBSOCKET
usig.services.sample-agent.allowed-image-hosts=cdn.example.com
usig.services.sample-agent.capabilities.streaming=true
usig.services.sample-agent.capabilities.cancel=true
usig.services.sample-agent.capabilities.resume=true
usig.services.sample-agent.capabilities.replay=false
usig.services.sample-agent.capabilities.task-query=true
usig.services.sample-agent.capabilities.human-input=true
usig.services.sample-agent.capabilities.multimodal-input=true
usig.services.sample-agent.capabilities.structured-output=true
usig.services.sample-agent.capabilities.retry-safety=RESUME_SAFE
usig.services.sample-agent.limits.max-concurrent-runs=500
usig.services.sample-agent.limits.max-concurrent-runs-per-tenant=100
usig.services.sample-agent.limits.max-concurrent-runs-per-group=500
usig.services.sample-agent.circuit-breaker.failure-threshold=5
usig.services.sample-agent.circuit-breaker.open-duration=PT30S
usig.services.sample-agent.circuit-breaker.half-open-max-probe-runs=1
%test.quarkus.otel.traces.exporter=none
%test.quarkus.otel.metrics.exporter=none
%test.quarkus.otel.logs.exporter=none
%test.quarkus.redis.devservices.enabled=false
%test.quarkus.datasource.devservices.enabled=false
%test.usig.websocket.require-secure=false
